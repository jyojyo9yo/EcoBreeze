<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoBreeze Signup</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-box">

    <h1>EcoBreeze</h1>
    <p>회원가입</p>

    <form id="signupForm">

        <input type="email" id="email" placeholder="이메일" autocomplete="email" required>

        <input type="password" id="password" placeholder="비밀번호 (6자 이상)" autocomplete="new-password" required>

        <input type="password" id="passwordConfirm" placeholder="비밀번호 확인" autocomplete="new-password" required>

        <p class="error" id="errorMsg"></p>

        <button type="submit">회원가입</button>

    </form>

    <a href="login.html">로그인으로 돌아가기</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/signup.js"></script>

</body>
</html>
