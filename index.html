<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoBreeze</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <div class="card">

        <div class="title">
            실내 온도
        </div>

        <div id="tempValue" class="temp">
            --°C
        </div>

        <div id="humidityValue" class="humidity">
            습도 --%
        </div>

    </div>

    <div class="card person-card">

        <div class="title">
            사람감지
        </div>

        <div id="personStatus" class="person-status status-offline">
            연결 대기중
        </div>

        <div id="personUpdatedAt" class="person-updated"></div>

    </div>

    <button id="aiModeBtn" class="ai-mode-btn">AI 모드</button>

    <h1>EcoBreeze</h1>

    <button id="logoutBtn" class="logout-btn">로그아웃</button>

</div>

<div id="aiModeModal" class="modal-overlay hidden">

    <div class="modal-box">

        <div class="modal-title">온도 허용 범위</div>

        <div class="modal-subtitle">AI가 온도 변화에 반응하는 민감도를 선택하세요</div>

        <div class="sensitivity-options">
            <button class="sensitivity-option" data-level="low">낮음</button>
            <button class="sensitivity-option" data-level="normal">보통</button>
            <button class="sensitivity-option" data-level="high">민감</button>
        </div>

        <div class="modal-actions">
            <button id="aiModeCancel" class="modal-btn-secondary">취소</button>
            <button id="aiModeSave" class="modal-btn-primary">저장</button>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/app.js"></script>
<script src="js/personStatus.js"></script>
<script src="js/aiMode.js"></script>

</body>
</html>
