<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoBreeze</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <div class="card">

        <div class="title">
            실내 온도
        </div>

        <div id="tempValue" class="temp">
            --°C
        </div>

        <div id="humidityValue" class="humidity">
            습도 --%
        </div>

    </div>

    <div class="card person-card">

        <div class="title">
            사람감지
        </div>

        <div id="personStatus" class="person-status status-offline">
            연결 대기중
        </div>

        <div id="personUpdatedAt" class="person-updated"></div>

    </div>

    <h1>EcoBreeze</h1>

    <button id="logoutBtn" class="logout-btn">로그아웃</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/app.js"></script>
<script src="js/personStatus.js"></script>

</body>
</html>
