<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoBreeze</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <div class="card">

        <div class="title">
            실내 온도
        </div>

        <div id="tempValue" class="temp">
            --°C
        </div>

        <div id="humidityValue" class="humidity">
            습도 --%
        </div>

    </div>

    <div class="card person-card">

        <div class="title">
            사람감지
        </div>

        <div id="personStatus" class="person-status status-offline">
            연결 대기중
        </div>

        <div id="personUpdatedAt" class="person-updated"></div>

    </div>

    <div class="mode-btn-row">
        <button id="acModeBtn" class="mode-btn">에어컨</button>
        <button id="sleepModeBtn" class="mode-btn">수면 모드</button>
        <button id="aiModeBtn" class="mode-btn">AI 모드</button>
    </div>

    <h1>EcoBreeze</h1>

    <button id="logoutBtn" class="logout-btn">로그아웃</button>

</div>

<div id="acModal" class="modal-overlay hidden">

    <div class="modal-box">

        <div class="modal-title">에어컨</div>

        <div class="toggle-row">
            <span id="acStatusLabel" class="status-label">꺼짐</span>
            <button id="acToggleBtn" class="toggle-btn off">OFF</button>
        </div>

        <div class="setting-row">
            <span class="setting-label">설정 온도</span>
            <div class="stepper">
                <button id="tempDownBtn" class="stepper-btn">-</button>
                <span id="tempSettingValue" class="setting-value">24.0°C</span>
                <button id="tempUpBtn" class="stepper-btn">+</button>
            </div>
        </div>

        <div class="modal-actions">
            <button id="acModalClose" class="modal-btn-primary">닫기</button>
        </div>

    </div>

</div>

<div id="sleepModal" class="modal-overlay hidden">

    <div class="modal-box">

        <div class="modal-title">수면 모드</div>

        <div class="toggle-row">
            <span id="sleepStatusLabel" class="status-label">꺼짐</span>
            <button id="sleepToggleBtn" class="toggle-btn off">OFF</button>
        </div>

        <div class="setting-row">
            <span class="setting-label">누운 후 자동 실행</span>
            <div class="stepper">
                <button id="sleepDelayDownBtn" class="stepper-btn">-</button>
                <span id="sleepDelayValue" class="setting-value">10분</span>
                <button id="sleepDelayUpBtn" class="stepper-btn">+</button>
            </div>
        </div>

        <div class="setting-row">
            <span class="setting-label">시간 단위</span>
            <div class="unit-toggle">
                <button id="sleepUnitMinBtn" class="unit-btn">분</button>
                <button id="sleepUnitSecBtn" class="unit-btn">초</button>
            </div>
        </div>

        <div id="sleepAutoNote" class="auto-note"></div>

        <div class="modal-actions">
            <button id="sleepModalClose" class="modal-btn-primary">닫기</button>
        </div>

    </div>

</div>

<div id="aiModeModal" class="modal-overlay hidden">

    <div class="modal-box">

        <div class="modal-title">온도 허용 범위</div>

        <div class="modal-subtitle">AI가 온도 변화에 반응하는 민감도를 선택하세요</div>

        <div class="sensitivity-options">
            <button class="sensitivity-option" data-level="low">낮음</button>
            <button class="sensitivity-option" data-level="normal">보통</button>
            <button class="sensitivity-option" data-level="high">민감</button>
        </div>

        <div class="modal-actions">
            <button id="aiModeCancel" class="modal-btn-secondary">취소</button>
            <button id="aiModeSave" class="modal-btn-primary">저장</button>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/app.js"></script>
<script src="js/personStatus.js"></script>
<script src="js/acControl.js"></script>
<script src="js/sleepMode.js"></script>
<script src="js/aiMode.js"></script>

</body>
</html>
